[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ncrp"
version = "1.0.0"
description = "Graph-based taxonomic label correction and propagation for metagenomic reads"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ncrp = "ncrp.main:main"

[tool.setuptools.packages.find]
include = ["ncrp*"]
